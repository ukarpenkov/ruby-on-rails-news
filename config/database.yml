# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   brew install postgresql@16
#   gem install pg -- --with-pg-config=/opt/homebrew/opt/postgresql@16/bin/pg_config
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ruby_on_rails_news_development

test:
  <<: *default
  database: ruby_on_rails_news_test

# Store production databases on the PostgreSQL server. Set DATABASE_URL
# or RUBY_ON_RAILS_NEWS_DATABASE_PASSWORD in the environment.
production:
  primary: &primary_production
    <<: *default
    database: ruby_on_rails_news_production
    username: ruby_on_rails_news
    password: <%= ENV["RUBY_ON_RAILS_NEWS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: ruby_on_rails_news_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: ruby_on_rails_news_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: ruby_on_rails_news_production_cable
    migrations_paths: db/cable_migrate
